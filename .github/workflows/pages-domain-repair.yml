name: SUN Pages domain repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-domain-repair.yml'

jobs:
  repair:
    runs-on: [self-hosted, Linux, X64, server123, suaveforge-deploy, suaveforge-org]
    timeout-minutes: 15

    steps:
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect and repair Pages custom-domain HTTPS
        shell: bash
        run: |
          set -Eeuo pipefail
          token_file=/home/actions-runners/suaveforge-org/secrets/deploy-token
          test -s "$token_file"
          token=$(tr -d '\r\n' < "$token_file")
          test -n "$token"
          echo "::add-mask::$token"
          export SUN_GH_TOKEN="$token"

          node <<'NODE'
          const repo='suaveforge/sun-deploy';
          const host='sun.suaveforge.com';
          const token=process.env.SUN_GH_TOKEN;
          const base='https://api.github.com';
          const headers={
            'Accept':'application/vnd.github+json',
            'Authorization':`Bearer ${token}`,
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'SUN-Pages-Repair'
          };
          async function api(path,{method='GET',body}={}){
            const r=await fetch(base+path,{
              method,headers:{...headers,...(body?{'Content-Type':'application/json'}:{})},
              body:body?JSON.stringify(body):undefined
            });
            const text=await r.text();
            let data=null;
            try{data=text?JSON.parse(text):null}catch{data=text}
            return {ok:r.ok,status:r.status,data};
          }
          function slim(x){
            if(!x||typeof x!=='object')return x;
            return {
              cname:x.cname??null,
              html_url:x.html_url??null,
              https_enforced:x.https_enforced??null,
              status:x.status??null,
              protected_domain_state:x.protected_domain_state??null,
              pending_domain_unverified_at:x.pending_domain_unverified_at??null
            };
          }

          let state=await api(`/repos/${repo}/pages`);
          console.log('SUN_PAGES_BEFORE='+JSON.stringify(slim(state.data)));

          const cname=await api(`/repos/${repo}/pages`,{method:'PUT',body:{cname:host}});
          console.log(`SUN_PAGES_CNAME_HTTP=${cname.status}`);
          if(!cname.ok && cname.status!==204) {
            console.log('SUN_PAGES_CNAME_ERROR='+JSON.stringify(cname.data));
            process.exit(31);
          }

          let enforced=false;
          for(let i=1;i<=60;i++){
            const put=await api(`/repos/${repo}/pages`,{method:'PUT',body:{https_enforced:true}});
            state=await api(`/repos/${repo}/pages`);
            const s=slim(state.data);
            console.log(`SUN_PAGES_HTTPS_ATTEMPT=${i} PUT_HTTP=${put.status} STATE=${JSON.stringify(s)}`);
            if((put.ok||put.status===204) && s?.https_enforced===true && String(s?.html_url||'').startsWith('https://')){
              enforced=true;
              break;
            }
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!enforced) process.exit(32);

          let live=false;
          for(let i=1;i<=30;i++){
            try{
              const r=await fetch('https://sun.suaveforge.com/app/',{redirect:'manual'});
              console.log(`SUN_PAGES_LIVE_ATTEMPT=${i} HTTP=${r.status}`);
              if(r.status>=200&&r.status<500){live=true;break}
            }catch(e){
              console.log(`SUN_PAGES_LIVE_ATTEMPT=${i} ERROR=${String(e.message||e)}`);
            }
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!live) process.exit(33);
          console.log('SUN_PAGES_HTTPS_LIVE=yes');
          NODE
