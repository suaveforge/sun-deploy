name: SUN demo timeline QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.qa-trigger'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract timeline frames
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s demo/sun-investor-demo.webm
          rm -rf demo/qa
          mkdir -p demo/qa
          ffmpeg -hide_banner -loglevel error -i demo/sun-investor-demo.webm             -vf "fps=1/2,scale=225:400:force_original_aspect_ratio=decrease,pad=225:400:(ow-iw)/2:(oh-ih)/2"             -frames:v 40 -q:v 7 /tmp/seq-%02d.jpg
          for f in /tmp/seq-*.jpg; do
            b="$(basename "$f" .jpg)"
            base64 -w0 "$f" > "demo/qa/$b.jpg.b64"
            printf "\n" >> "demo/qa/$b.jpg.b64"
          done
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 demo/sun-investor-demo.webm > demo/qa/duration.txt
      - name: Commit QA frames
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "sun-demo-qa"
          git config user.email "sun-demo-qa@users.noreply.github.com"
          git add demo/qa
          git commit -m "Add SUN demo timeline QA frames"
          git push origin HEAD:main
