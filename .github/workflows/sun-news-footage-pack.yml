name: SUN News Footage Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.sun-newsclips-trigger'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install video tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Download four original KTV broadcaster segments
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/sun-news-clips
          cat > /tmp/sun-ktv-fetch.py <<'PY'
          import urllib.request, re, xml.etree.ElementTree as ET, subprocess, pathlib, time
          out=pathlib.Path('/tmp/sun-news-clips')
          cases=[
            ('01_2014_contact_only',495312,'KTV','좋은사람 있다더니…결혼중개 피해 속출','2014-11-17'),
            ('02_2019_broken_promises',583125,'KTV','약속 안 지키고 환불도 안 돼…결혼중개업체 주의','2019-09-18'),
            ('03_2015_refund',498788,'KTV','공정위, 결혼중개업체 환급기준 구체화','2015-01-13'),
            ('04_2026_profile_only',758365,'KTV','결혼 중개 피해 매년 증가…프로필만 주고 만남 횟수 차감','2026-07-24'),
          ]
          def read(url):
            sources=[url]
            if 'www.ktv.go.kr/' in url: sources += [url.replace('www.ktv.go.kr/','m.ktv.go.kr/')]
            errors=[]
            for attempt in range(7):
              for candidate in sources:
                try:
                  req=urllib.request.Request(candidate,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xml;q=0.9,*/*;q=0.8'})
                  return urllib.request.urlopen(req,timeout=12).read().decode('utf-8')
                except Exception as e:
                  errors.append(f'{candidate}: {repr(e)}')
              time.sleep(2+attempt)
            raise RuntimeError('KTV source unreachable: '+url+' | '+errors[-1])
          for filename,id,publisher,title,date in cases:
            player=read(f'https://www.ktv.go.kr/content/player?content_id={id}')
            file_id=re.search(r'fileId\s*:\s*"([^"]+)"',player)
            if not file_id: raise RuntimeError(f'No fileId for {id}')
            metadata=ET.fromstring(read(f'http://hdvod.ktv.go.kr:8080/rest/file/view/{file_id.group(1)}'))
            instance=metadata.findtext('instanceId')
            smil=metadata.findtext('smilFile')
            root=ET.fromstring(read(f'http://hdvod.ktv.go.kr:8080/rest/stream/url/http/{instance}'))
            base=root.findtext('url')
            src=f'{base}{smil}/playlist.m3u8'
            print('DOWNLOADING',id,src,flush=True)
            cmd=['ffmpeg','-hide_banner','-loglevel','error','-y',
                 '-i',src,'-t','6.2','-vf','scale=720:-2,format=yuv420p',
                 '-c:v','libx264','-preset','ultrafast','-crf','25','-threads','2',
                 '-c:a','aac','-b:a','128k','-ar','48000',
                 '-movflags','+faststart',str(out/f'{filename}.mp4')]
            subprocess.run(cmd,check=True,timeout=180)
            print('COMPLETED',id,(out/f'{filename}.mp4').stat().st_size,flush=True)
          with open(out/'sources.txt','w') as f:
            for filename,id,publisher,title,date in cases:
              f.write(f'{filename}.mp4 | {publisher} | {date} | {title} | https://www.ktv.go.kr/content/view?content_id={id}\n')
          PY
          python /tmp/sun-ktv-fetch.py
          for f in /tmp/sun-news-clips/*.mp4; do test -s "$f"; ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"; done
      - name: Upload private review assets
        uses: actions/upload-artifact@v4
        with:
          name: sun-four-news-footage
          path: /tmp/sun-news-clips/
          retention-days: 1
          if-no-files-found: error
