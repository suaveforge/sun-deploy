name: SUN one-time artifact import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-sun-artifact.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import validated SUN web artifact
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-36a8-8209-8529-1315c3224c9f/raw?se=2026-10-03T03%3A28%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=9048775e-7c89-5637-85da-d0a05d0eaa48&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T02%3A46%3A48Z&ske=2026-10-04T02%3A46%3A48Z&sks=b&skv=2026-02-06&sig=Re4r2KScxcShmhkfKyD%2Bg8mkSDOGb0ldpxz6z2QpRwA%3D"
        run: |
          set -Eeuo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/sun-public-web.zip
          rm -rf /tmp/sun-public-web
          mkdir -p /tmp/sun-public-web
          unzip -q /tmp/sun-public-web.zip -d /tmp/sun-public-web

          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" -exec rm -rf {} +
          cp -a /tmp/sun-public-web/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy SUN WEB from source 9ffbf91287d5f60d0e8319efb5ca754f68614377" || true

          git rm -f .github/workflows/import-sun-artifact.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "Remove one-time SUN artifact importer"
          git push origin HEAD:main
