name: Inspect KTV video source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.ktv-inspect-trigger'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect page
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://www.ktv.go.kr/content/player?content_id=758365'
          curl -L --compressed -A 'Mozilla/5.0' -sS "$url" -o /tmp/ktv.html
          wc -c /tmp/ktv.html
          grep -Eoi 'https?[^"<> ]+\.(m3u8|mp4)([^"<> ]*)?' /tmp/ktv.html | head -20 || true
          grep -Ein 'm3u8|mp4|video|content_id|media' /tmp/ktv.html | head -80 || true
          sed -n '35,95p' /tmp/ktv.html
          echo '--- script sources ---'
          grep -Eo 'src="[^"]+"' /tmp/ktv.html | sed 's/^src="//;s/"$//' | grep 'vodplayer' || true
          echo '--- env.js ---'
          curl -L --compressed -A 'Mozilla/5.0' -sS 'https://www.ktv.go.kr/resources/js/library/vodplayer/extend/js/env.js?v=clp' -o /tmp/env.js
          cat /tmp/env.js
          echo '--- player js refs ---'
          for src in $(grep -Eo 'src="[^"]+"' /tmp/ktv.html | sed 's/^src="//;s/"$//' | grep 'vodplayer'); do
            case "$src" in http*) u="$src";; *) u="https://www.ktv.go.kr$src";; esac
            echo "### $u"
            curl -L --compressed -A 'Mozilla/5.0' -sS "$u" | grep -Ein 'fileId|HLS|m3u8|smil|media|url|source|VOD' | head -120 || true
          done

      - name: Inspect core player scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          for rel in \
            '/resources/js/library/vodplayer/extend/js/init.js' \
            '/resources/js/library/vodplayer/wenplayer.js' \
            '/resources/js/library/vodplayer/player/wenplayer_5.js'
          do
            echo "### $rel"
            curl -L --compressed -A 'Mozilla/5.0' -sS "https://www.ktv.go.kr$rel" |
              grep -Ein 'mediaHost|ajaxMediaHost|fileId|m3u8|smil|stream|source|playurl|GetFile|fileinfo|vod' |
              head -220 || true
          done

      - name: Resolve KTV file metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          for scheme in http https; do
            url="$scheme://hdvod.ktv.go.kr:8080/rest/file/view/36948bc0-0478-403b-b003-9b70a851123b"
            echo "### $url"
            curl -L --max-time 20 -A 'Mozilla/5.0' -sS "$url" || true
            echo
          done
